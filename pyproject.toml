[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nimrod"
description = "Cross-session work memory shared by Claude Code, Codex, OpenCode and Pi"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Danilo Falcão", email = "danilo@falcao.org" }]
keywords = [
    "ai-agents",
    "agent-memory",
    "claude-code",
    "codex",
    "opencode",
    "pi",
    "mcp",
    "worklog",
    "sqlite",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control",
    "Topic :: Utilities",
]
dependencies = [
    "mcp>=2.0",
    "fastembed>=0.4",
    "numpy>=1.26",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nimrod = "nimrod.cli:main"
nimrod-mcp = "nimrod.mcp_server:main"

[project.urls]
Homepage = "https://github.com/danilofalcao/nimrod"
Repository = "https://github.com/danilofalcao/nimrod"
Issues = "https://github.com/danilofalcao/nimrod/issues"

[tool.setuptools.dynamic]
version = { attr = "nimrod.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
